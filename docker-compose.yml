services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry_dev_password
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: telemetry
      RABBITMQ_DEFAULT_PASS: telemetry_dev_password
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: ./src/Telemetry.Api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Telemetry: Host=postgres;Port=5432;Database=telemetry;Username=telemetry;Password=telemetry_dev_password
      RabbitMq__Host: rabbitmq
      RabbitMq__User: telemetry
      RabbitMq__Password: telemetry_dev_password
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  analytics-worker:
    build: ./src/Analytics.Worker
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: telemetry
      RABBITMQ_PASSWORD: telemetry_dev_password
      DATABASE_URL: postgresql://telemetry:telemetry_dev_password@postgres:5432/telemetry
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
