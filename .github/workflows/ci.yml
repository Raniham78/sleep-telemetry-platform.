name: build-and-test

on:
  push:
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore SleepTelemetry.sln
      - run: dotnet build SleepTelemetry.sln --configuration Release --no-restore
      - run: dotnet test SleepTelemetry.sln --configuration Release --no-build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - run: pip install -r requirements.txt
        working-directory: src/Analytics.Worker
      - run: python -m unittest discover -s tests
        working-directory: src/Analytics.Worker
